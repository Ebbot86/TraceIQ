name: Build TraceIQ APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: traceiq-main-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: bash tests/run.sh
      - run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TraceIQ-1.3.0-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/TraceIQ-1.3.0-test.apk
          (cd dist && sha256sum TraceIQ-1.3.0-test.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: TraceIQ-1.3.0-debug-APK
          path: dist/
          if-no-files-found: error
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.0-test-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; not replacing its APK."
          else
            gh release create "$TAG" dist/TraceIQ-1.3.0-test.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "TraceIQ 1.3.0 – Test ${GITHUB_RUN_NUMBER}" --notes "Android test build. Debug signing only; subsequent builds may require uninstalling the previous test app. No stable in-app updates yet."
          fi
